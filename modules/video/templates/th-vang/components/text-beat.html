<!doctype html>
<html lang="vi" data-composition-variables='[
  {"id":"kicker","type":"string","label":"Nhãn nhỏ","default":"","maxLength":40},
  {"id":"title","type":"string","label":"Tiêu đề","default":"Có gì trong đầu|*nói luôn*","maxLength":120},
  {"id":"sub","type":"string","label":"Chữ phụ","default":"","maxLength":120},
  {"id":"animIn","type":"enum","label":"Hiệu ứng vào","default":"slide-up","options":[
    {"value":"typewriter","label":"Gõ chữ"},{"value":"slide-short","label":"Trượt ngắn"},{"value":"slide-up","label":"Trượt lên"},
    {"value":"pop","label":"Bật lên"},{"value":"fade","label":"Hiện mờ"}]},
  {"id":"duration","type":"number","label":"Thời lượng","default":2.4,"min":0.5,"max":30,"step":0.1,"unit":"s"}
]'>
<head><meta charset="utf-8"><title>Talking head vàng · Nhịp chữ</title></head>
<body>
<template id="text-beat">
<style>
  #root { position: absolute; inset: 0; container-type: size; pointer-events: none; }
  .tb-wrap {
    --tb-span: 88cqw; --tb-max: 12cqmin;
    position: absolute; left: 6cqw; right: 6cqw; top: 21cqh;
    display: flex; flex-direction: column; align-items: center; gap: 1.8cqmin; text-align: center;
  }
  @container (orientation: landscape) { .tb-wrap { --tb-span: 76cqw; --tb-max: 13cqmin; left: 12cqw; right: 12cqw; top: 14cqh; } }
  .tb-kicker {
    display: none; padding: 0.5cqmin 1.6cqmin; border-radius: 0.8cqmin;
    background: var(--th-accent, #FFD23F); color: var(--th-dark, #141416);
    font-family: var(--th-font-sub, 'Montserrat'), sans-serif; font-weight: 800;
    font-size: 3.2cqmin; line-height: 1.5; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .tb-title {
    font-family: var(--th-font-title, 'Anton'), sans-serif; font-weight: 400;
    font-size: min(var(--tb-max), calc(var(--tb-span) / (var(--chars, 12) * 0.5)));
    line-height: 1.1; text-transform: uppercase; color: var(--th-accent, #FFD23F);
    /* Dark outline outside the glyphs (paint-order keeps the fill whole) and a tight drop under it, so the
       yellow still reads on a bright shot. */
    -webkit-text-stroke: 0.05em var(--th-dark, #141416); paint-order: stroke fill;
    text-shadow: 0 0.035em 0 var(--th-dark, #141416), 0 0.06em 0.22em rgba(0, 0, 0, 0.55);
  }
  .tb-line { display: block; }
  .tb-w { display: inline-block; white-space: nowrap; }
  .tb-hl { position: relative; display: inline-block; white-space: nowrap; }
  .tb-hl-a { display: inline-block; padding: 0 0.12em; }
  .tb-hl-b {
    position: absolute; inset: 0; padding: 0 0.12em; border-radius: 0.06em;
    background: var(--th-accent, #FFD23F); color: var(--th-dark, #141416); text-shadow: none; -webkit-text-stroke: 0;
    clip-path: inset(0 100% 0 0);
  }
  .tb-caret {
    display: inline-block; width: 0.07em; height: 0.82em; margin-left: 0.05em; vertical-align: -0.04em;
    background: var(--th-text, #FFFFFF); opacity: 0;
  }
  .tw .tb-ch, .tw .tb-sp { display: none; }
  .tb-sub {
    display: none; max-width: 100%;
    font-family: var(--th-font-sub, 'Montserrat'), sans-serif; font-style: italic; font-weight: 600;
    font-size: 4cqmin; line-height: 1.3; color: var(--th-text, #FFFFFF);
    /* Same dark outline as the title: white italic vanishes on a bright shot with a soft shadow alone. */
    -webkit-text-stroke: 0.06em var(--th-dark, #141416); paint-order: stroke fill;
    text-shadow: 0 0.05em 0 var(--th-dark, #141416), 0 0.08em 0.4em rgba(0, 0, 0, 0.75);
  }
</style>
<div id="root" data-composition-id="text-beat">
  <div class="tb-wrap">
    <div class="tb-kicker"></div>
    <div class="tb-title"></div>
    <div class="tb-sub"></div>
  </div>
</div>
<script>
  // Talking head vàng · Nhịp chữ. Markup: *từ* = tô vàng, | = xuống dòng (tối đa 3 dòng hiển thị).
  // Seek-safe: everything is built once from the variables, then driven by one paused timeline.
  const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  const PRESETS = ['typewriter', 'slide-short', 'slide-up', 'pop', 'fade'];
  const text = (v) => (v === undefined || v === null ? '' : String(v)).trim();
  const D = Math.max(0.5, Number(vars.duration) || 2.4);
  const anim = PRESETS.indexOf(vars.animIn) >= 0 ? vars.animIn : 'slide-up';
  const typing = anim === 'typewriter';

  const wrap = document.querySelector('.tb-wrap');
  const kickerEl = document.querySelector('.tb-kicker');
  const titleEl = document.querySelector('.tb-title');
  const subEl = document.querySelector('.tb-sub');

  const graphemes = (s) => {
    if (typeof Intl !== 'undefined' && Intl.Segmenter) return Array.from(new Intl.Segmenter('vi', { granularity: 'grapheme' }).segment(s), (g) => g.segment);
    return Array.from(s);
  };
  const el = (tag, cls, content) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (content !== undefined) node.textContent = content;
    return node;
  };

  // "a *b c*|d" → lines of runs: [[{hl:false, words:['a']}, {hl:true, words:['b','c']}], [{hl:false, words:['d']}]]
  function parseMarkup(src, maxLines) {
    const lines = src.normalize('NFC').split('|').map((s) => s.trim()).filter(Boolean);
    if (lines.length > maxLines) lines.splice(maxLines - 1, lines.length, lines.slice(maxLines - 1).join(' '));
    let hl = false;
    return lines.map((line) => {
      const runs = [];
      const parts = line.split('*');
      parts.forEach((part, i) => {
        if (i > 0) hl = !hl;
        const words = part.split(/\s+/).filter(Boolean);
        if (!words.length) return;
        // No space in the source at a "*" ("*file*, mô") means none on screen either: "FILE, MÔ", not "FILE , MÔ".
        const glue = i > 0 && !/^\s/.test(part) && !/\s$/.test(parts[i - 1]);
        const last = runs[runs.length - 1];
        if (last && last.hl === hl) {
          if (glue) last.words[last.words.length - 1] += words.shift();
          last.words.push(...words);
        } else runs.push({ hl, words, glue });
      });
      return runs;
    }).filter((runs) => runs.length);
  }

  // A word: chars as spans when typing (revealed one by one), else plain text.
  const word = (w) => {
    const node = el('span', 'tb-w');
    if (typing) for (const g of graphemes(w)) node.appendChild(el('span', 'tb-ch', g));
    else node.textContent = w;
    return node;
  };

  const lines = parseMarkup(text(vars.title), 3);
  let longest = 1;
  for (const runs of lines) {
    const line = el('span', 'tb-line');
    const all = runs.flatMap((r) => r.words);
    longest = Math.max(longest, graphemes(all.join(' ')).length + runs.filter((r) => r.hl).length);
    runs.forEach((run, ri) => {
      if (ri > 0 && !run.glue) line.appendChild(el('span', 'tb-sp', ' '));
      const target = run.hl ? el('span', 'tb-hl-a') : line;
      run.words.forEach((w, wi) => {
        if (wi > 0) target.appendChild(el('span', 'tb-sp', ' '));
        target.appendChild(word(w));
      });
      if (run.hl) {
        // The box copy covers the plain copy on purpose (the sweep reveals it), so the layout audit may skip it.
        const hl = el('span', 'tb-hl');
        const box = el('span', 'tb-hl-b', run.words.join(' '));
        for (const node of [hl, box, target, ...target.querySelectorAll('*')]) node.setAttribute('data-layout-allow-occlusion', '');
        hl.setAttribute('data-layout-allow-overflow', '');
        hl.appendChild(target);
        hl.appendChild(box);
        line.appendChild(hl);
      }
    });
    if (typing) line.appendChild(el('span', 'tb-caret'));
    titleEl.appendChild(line);
  }
  titleEl.style.setProperty('--chars', String(longest));
  if (typing) titleEl.classList.add('tw');

  const kicker = text(vars.kicker);
  const sub = text(vars.sub);
  if (kicker) { kickerEl.textContent = kicker; kickerEl.style.display = 'block'; }
  if (sub) { subEl.textContent = sub; subEl.style.display = 'block'; }

  const tl = gsap.timeline({ paused: true });
  const budget = Math.min(0.9, D * 0.45);
  let t = 0.04;
  if (kicker) {
    tl.fromTo(kickerEl, { opacity: 0, yPercent: -40 }, { opacity: 1, yPercent: 0, duration: 0.24, ease: 'power2.out' }, t);
    t += 0.1;
  }

  const words = Array.from(titleEl.querySelectorAll('.tb-hl-a, .tb-line > .tb-w'));
  const lineEls = Array.from(titleEl.querySelectorAll('.tb-line'));
  let titleEnd = t;
  if (typing) {
    const steps = Array.from(titleEl.querySelectorAll('.tb-ch, .tb-sp'));
    const step = Math.min(0.05, Math.max(0.016, budget / Math.max(1, steps.length)));
    const carets = Array.from(titleEl.querySelectorAll('.tb-caret'));
    let shown = 0;
    lineEls.forEach((line, li) => {
      const own = Array.from(line.querySelectorAll('.tb-ch, .tb-sp'));
      const start = t + shown * step;
      tl.set(carets[li], { opacity: 1 }, start);
      own.forEach((node, k) => tl.set(node, { display: 'inline' }, start + k * step));
      shown += own.length;
      if (li < lineEls.length - 1) tl.set(carets[li], { opacity: 0 }, t + shown * step);
    });
    titleEnd = t + shown * step;
    const last = carets[carets.length - 1];
    // The caret blinks at most twice while there is room, then hides: a fixed number of sets.
    let blinkAt = titleEnd + 0.22;
    for (let k = 0; last && k < 4 && blinkAt < D - 0.35; k++, blinkAt += 0.22) tl.set(last, { opacity: k % 2 ? 1 : 0 }, blinkAt);
    if (last) tl.set(last, { opacity: 0 }, Math.max(titleEnd, Math.min(blinkAt, D - 0.3)));
  } else if (anim === 'slide-short') {
    tl.fromTo(lineEls, { opacity: 0, xPercent: -6 }, { opacity: 1, xPercent: 0, duration: 0.32, ease: 'power3.out', stagger: 0.08 }, t);
    titleEnd = t + 0.32 + 0.08 * (lineEls.length - 1);
  } else if (anim === 'slide-up') {
    const s = Math.min(0.07, budget / Math.max(1, words.length));
    tl.fromTo(words, { opacity: 0, yPercent: 70 }, { opacity: 1, yPercent: 0, duration: 0.4, ease: 'power3.out', stagger: s }, t);
    titleEnd = t + 0.4 + s * (words.length - 1);
  } else if (anim === 'pop') {
    const s = Math.min(0.07, budget / Math.max(1, words.length));
    tl.fromTo(words, { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.34, ease: 'back.out(2.4)', stagger: s }, t);
    titleEnd = t + 0.34 + s * (words.length - 1);
  } else {
    tl.fromTo(titleEl, { opacity: 0, filter: 'blur(12px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'sine.out' }, t);
    titleEnd = t + 0.5;
  }

  // Highlight: a yellow box sweeps left → right under the keyword, the text turns dark under it.
  const boxes = Array.from(titleEl.querySelectorAll('.tb-hl-b'));
  if (boxes.length) {
    tl.fromTo(boxes, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.26, ease: 'power2.out', stagger: 0.08 }, Math.max(t, titleEnd - 0.06));
  }
  if (sub) tl.fromTo(subEl, { opacity: 0, yPercent: 30 }, { opacity: 1, yPercent: 0, duration: 0.3, ease: 'power2.out' }, Math.min(titleEnd, D - 0.6));

  const out = Math.max(titleEnd + 0.3, D - 0.24);
  if (out < D - 0.05) tl.to(wrap, { opacity: 0, yPercent: -6, duration: Math.min(0.22, D - out), ease: 'power1.in' }, out);

  window.__timelines["text-beat"] = tl;
</script>
</template>
</body>
</html>
