<!doctype html>
<html lang="vi" data-composition-variables='[
  {"id":"logo","type":"string","label":"Logo","default":""},
  {"id":"name","type":"string","label":"Tên kênh","default":"Kênh của bạn","maxLength":60},
  {"id":"handle","type":"string","label":"Tài khoản","default":"","maxLength":60},
  {"id":"cta","type":"string","label":"Lời kêu gọi","default":"Theo dõi để xem tiếp","maxLength":60},
  {"id":"animIn","type":"enum","label":"Hiệu ứng vào","default":"pop","options":[
    {"value":"pop","label":"Bật lên"},{"value":"slide-up","label":"Trượt lên"},{"value":"fade","label":"Hiện mờ"}]},
  {"id":"duration","type":"number","label":"Thời lượng","default":2.5,"min":1,"max":30,"step":0.1,"unit":"s"}
]'>
<head><meta charset="utf-8"><title>Talking head vàng · Logo cuối</title></head>
<body>
<template id="logo-end">
<style>
  #root { position: absolute; inset: 0; container-type: size; overflow: hidden; }
  .le-scene { position: absolute; inset: 0; }
  .le-bg {
    position: absolute; inset: 0; background: var(--th-bg, #000000);
    background-image: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--th-accent, #FFD23F) 18%, transparent), transparent 55%);
  }
  .le-body {
    position: absolute; left: 8cqw; right: 8cqw; top: 26cqh;
    display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; text-align: center;
  }
  @container (orientation: landscape) { .le-body { top: 16cqh; } }
  .le-mark { position: relative; width: 30cqmin; height: 30cqmin; }
  .le-ring {
    position: absolute; inset: 0; border-radius: 50%; border: 0.8cqmin solid var(--th-accent, #FFD23F); opacity: 0;
  }
  .le-logo {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
    border-radius: 50%; background: var(--th-accent, #FFD23F); color: var(--th-dark, #141416);
    font-family: var(--th-font-title, 'Anton'), sans-serif; font-size: 12cqmin; line-height: 1;
  }
  .le-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .le-name {
    font-family: var(--th-font-title, 'Anton'), sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: min(10cqmin, calc(84cqw / (var(--chars, 12) * 0.5))); line-height: 1.1; color: var(--th-accent, #FFD23F);
  }
  .le-handle {
    display: none; font-family: var(--th-font-sub, 'Montserrat'), sans-serif; font-weight: 600;
    font-size: 4cqmin; line-height: 1.3; color: var(--th-text, #FFFFFF);
  }
  .le-cta {
    display: none; margin-top: 2cqmin; padding: 1.8cqmin 4.4cqmin; border-radius: 999px;
    background: var(--th-accent, #FFD23F); color: var(--th-dark, #141416);
    font-family: var(--th-font-sub, 'Montserrat'), sans-serif; font-weight: 800; font-size: 4.2cqmin; line-height: 1.2;
  }
</style>
<div id="root" data-composition-id="logo-end">
  <div class="le-scene">
    <div class="le-bg"></div>
    <div class="le-body">
      <div class="le-mark">
        <div class="le-ring"></div>
        <div class="le-logo"><img alt="" data-var-src="logo"></div>
      </div>
      <div class="le-name"></div>
      <div class="le-handle"></div>
      <div class="le-cta"></div>
    </div>
  </div>
</div>
<script>
  // Talking head vàng · Logo cuối: logo tròn (không có logo thì chữ cái đầu của tên kênh), tên kênh,
  // tài khoản và nút kêu gọi. Đứng yên tới hết video.
  const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  const text = (v) => (v === undefined || v === null ? '' : String(v)).trim();
  const D = Math.max(1, Number(vars.duration) || 2.5);
  const anim = ['pop', 'slide-up', 'fade'].indexOf(vars.animIn) >= 0 ? vars.animIn : 'pop';

  const bg = document.querySelector('.le-bg');
  const ring = document.querySelector('.le-ring');
  const logoEl = document.querySelector('.le-logo');
  const nameEl = document.querySelector('.le-name');
  const handleEl = document.querySelector('.le-handle');
  const ctaEl = document.querySelector('.le-cta');

  const name = text(vars.name).normalize('NFC');
  if (!text(vars.logo)) {
    // No logo file: the initials of the channel name stand in for it.
    const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => Array.from(w)[0]).join('').toUpperCase();
    logoEl.textContent = initials || '★';
  }
  nameEl.textContent = name;
  nameEl.style.setProperty('--chars', String(Math.max(1, Array.from(name).length)));
  const handle = text(vars.handle);
  const cta = text(vars.cta);
  if (handle) { handleEl.textContent = handle; handleEl.style.display = 'block'; }
  if (cta) { ctaEl.textContent = cta; ctaEl.style.display = 'block'; }

  const IN = {
    pop: [{ opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.42, ease: 'back.out(2.2)' }],
    'slide-up': [{ opacity: 0, yPercent: 30 }, { opacity: 1, yPercent: 0, duration: 0.4, ease: 'power3.out' }],
    fade: [{ opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'sine.out' }],
  };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(bg, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.out' }, 0);
  tl.fromTo(logoEl, IN[anim][0], IN[anim][1], 0.1);
  tl.fromTo(ring, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.45, duration: 0.7, ease: 'power2.out' }, 0.32);
  tl.fromTo(nameEl, { opacity: 0, yPercent: 40 }, { opacity: 1, yPercent: 0, duration: 0.34, ease: 'power3.out' }, 0.34);
  if (handle) tl.fromTo(handleEl, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'sine.out' }, 0.5);
  if (cta) {
    tl.fromTo(ctaEl, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.34, ease: 'back.out(2.4)' }, 0.62);
    // A gentle pulse, a whole number of times that fits before the end.
    const pulses = Math.max(0, Math.min(3, Math.floor((D - 1.3) / 0.8)));
    if (pulses > 0) tl.to(ctaEl, { scale: 1.06, duration: 0.4, ease: 'sine.inOut', yoyo: true, repeat: pulses * 2 - 1 }, 1.1);
  }

  window.__timelines["logo-end"] = tl;
</script>
</template>
</body>
</html>
